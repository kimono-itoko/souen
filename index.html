<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>MindAR Test - Souen</title>

    <!-- A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.0/dist/aframe/build/aframe.min.js"></script>
    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.0/dist/aframe/build/mindar-image-aframe.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="loading">カメラを起動しています...</div>

    <a-scene
      mindar-image="imageTargetSrc: ./hiro.mind;"
      embedded
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      background-color="black"
    >
      <!-- カメラ -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- マーカー上に緑の箱 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-box
          position="0 0.5 0"
          scale="0.5 0.5 0.5"
          material="color: green;"
        ></a-box>
      </a-entity>
    </a-scene>

    <script>
      // カメラ起動後にローディング非表示
      document.querySelector("a-scene").addEventListener("renderstart", () => {
        document.getElementById("loading").style.display = "none";
      });
    </script>
  </body>
</html>
