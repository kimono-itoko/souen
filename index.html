<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>AR 75坪畑（MindAR.js版）</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR.js A-Frame版 -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: black;
      }
      a-scene {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
      }
    </style>
  </head>

  <body>
    <!-- MindAR.jsシーン -->
    <a-scene
      mindar-image="imageTargetSrc: ./hiro.mind; maxTrack: 1;"
      color-space="sRGB"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
    >
      <!-- hiroマーカー上に畑モデル -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 畑の緑いろ平面 -->
        <a-box
          position="0 0 0"
          width="16"
          height="0.01"
          depth="15.5"
          color="#228B22"
        ></a-box>
        <!-- 畑のふち -->
        <a-box
          position="0 0.01 0"
          width="16"
          height="0.005"
          depth="15.5"
          color="#006400"
        ></a-box>
      </a-entity>

      <!-- カメラ -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
