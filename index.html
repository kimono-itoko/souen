<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>AR 75坪畑（iPhone対応版）</title>
    <!-- A-Frame と AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      a-scene {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }

      #footer {
        display: none;
      }
    </style>
  </head>
  <body>
    <a-scene
      arjs="trackingMethod: best; sourceType: webcam; sourceWidth: window.innerWidth; sourceHeight: window.innerHeight; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      background="color: transparent"
    >
      <!-- hiroマーカー -->
      <a-marker preset="hiro">
        <!-- 畑モデル：高さ0.01に小さくしてカメラ背景を見せる -->
        <a-box
          position="8 0.01 7.75"
          width="16"
          height="0.01"
          depth="15.5"
          color="#228B22"
        ></a-box>
        <!-- 外枠 -->
        <a-box
          position="8 0.015 7.75"
          width="16"
          height="0.005"
          depth="15.5"
          color="#006400"
        ></a-box>
      </a-marker>

      <!-- カメラ -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
