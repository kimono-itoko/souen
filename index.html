<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AR 75坪畑（GitHub Pages版）</title>
  <!-- A-Frame と AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* a-sceneを画面いっぱい・最前面に固定 */
    a-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
    }

    /* footer非表示 */
    #footer {
      display: none;
    }
  </style>
</head>
<body>
  <!-- ARシーン -->
  <a-scene
    arjs="trackingMethod: best; sourceType: webcam; sourceWidth: window.innerWidth; sourceHeight: window.innerHeight; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
  >
    <!-- hiroマーカー -->
    <a-marker preset="hiro">
      <!-- 75坪畑モデル -->
      <a-box position="8 0.1 7.75" width="16" height="0.2" depth="15.5" color="#228B22"></a-box>
      <!-- 外枠 -->
      <a-box position="8 0.21 7.75" width="16" height="0.02" depth="15.5" color="#006400"></a-box>
    </a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
